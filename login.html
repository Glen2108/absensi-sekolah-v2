<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Guru - Absensi Digital</title>
    
    <!-- Memuat font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Memanggil desain CSS modern yang sudah dibuat -->
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <img src="logo-sekolah.png" alt="Logo Sekolah" class="logo-sekolah">
        
        <h2>Akses Dasbor</h2>
        <p style="margin-bottom: 20px; color: #555; font-size: 14px;">Silakan masuk dengan akun Firebase Anda</p>
        
        <form id="login-form">
            <!-- Menambahkan emoji agar senada dengan halaman utama -->
            <input type="email" id="email" placeholder="📧 Email Guru" required>
            <input type="password" id="password" placeholder="🔑 Kata Sandi" required>
            
            <button type="submit">Masuk</button>
        </form>

        <div style="margin-top: 20px; font-size: 13px;">
            <a href="index.html" style="color: #666; text-decoration: none; font-weight: 600;">
                ⬅️ Kembali ke Halaman Absen
            </a>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
