<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Guru - Rekap Absensi</title>
    
    <!-- Memuat font Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Tambahkan class dashboard-container di sini -->
    <div class="container dashboard-container">
        <h2>Rekap Absensi Siswa</h2>
        
        <button id="btn-logout" style="background-color: #dc3545; margin-bottom: 20px;">Keluar / Logout</button>
        
        <!-- Kartu Rekap -->
        <div class="rekap-cards">
            <span>Total Hadir: <b id="count-total">0</b></span>
            <span>X-2: <b id="count-x">0</b></span>
            <span>XI-2: <b id="count-xi">0</b></span>
            <span>XII-5: <b id="count-xii">0</b></span>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
            <input type="text" id="search-nama" placeholder="🔍 Cari Nama Siswa..." style="flex: 2; min-width: 200px; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
            <select id="filter-kelas" style="flex: 1; min-width: 150px;">
                <option value="Semua">Semua Kelas</option>
                <option value="X-2">Kelas X-2</option>
                <option value="XI-2">Kelas XI-2</option>
                <option value="XII-5">Kelas XII-5</option>
            </select>
            <button id="btn-export" style="background-color: #28a745; flex: 1; min-width: 180px;">📥 Export Excel (CSV)</button>
            <button id="btn-reset" style="background-color: #dc3545; flex: 1; min-width: 150px;">⚠️ Reset Semua Data</button>
        </div>

        <!-- BUNGKUS TABEL DENGAN DIV INI AGAR RESPONSIF DI HP -->
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Siswa</th>
                        <th style="text-align: center;">Kelas</th>
                        <th style="text-align: center;">Status</th>
                        <th>Keterangan</th>
                        <th style="text-align: center;">Waktu Absen</th>
                        <th style="text-align: center;">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tabel-absensi">
                    <tr><td colspan="7" align="center">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="pagination-controls" style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px;">
            <button id="btn-prev" style="background-color: #6c757d; min-width: 120px;" disabled>⬅️ Sebelumnya</button>
            <span id="page-info" style="font-weight: 600;">Halaman 1 dari 1</span>
            <button id="btn-next" style="background-color: #007bff; min-width: 120px;" disabled>Selanjutnya ➡️</button>
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then((registration) => {
                console.log('ServiceWorker sukses didaftarkan dengan scope: ', registration.scope);
            }).catch((err) => {
                console.error('ServiceWorker pendaftaran gagal: ', err);
            });
        });
    }
</script>
</body>
</html>
