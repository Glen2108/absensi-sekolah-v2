<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Digital - Scan QR</title>
    
    <!-- Memuat font Poppins untuk gaya modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <img src="logo-sekolah.png" alt="Logo Sekolah" class="logo-sekolah">
        <h2>Absensi Digital</h2>
        <p style="margin-bottom: 20px; color: #555; font-size: 14px;">Arahkan QR Code Anda ke kamera di bawah ini</p>
        
        <div id="reader"></div>
        
        <form id="absensi-form">
            <input type="text" id="namaSiswa" placeholder="👤 Nama Siswa (Dari QR)" required readonly>
            <input type="text" id="kelasSiswa" placeholder="🏫 Kelas (Dari QR)" required readonly>
            
            <select id="statusAbsen" required>
                <option value="" disabled selected>✨ Pilih Status Kehadiran ✨</option>
                <option value="Hadir">Hadir</option>
                <option value="Sakit">Sakit</option>
                <option value="Izin">Izin</option>
            </select>
            
            <input type="text" id="keterangan" placeholder="📝 Keterangan (Khusus Sakit/Izin)">
            
            <button type="submit" id="btn-submit" disabled>Kirim Absen</button>
            <button id="btn-install" style="display: none; background-color: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; cursor: pointer; width: 100%;">
                📱 Install Aplikasi di HP
            </button>
        </form>

        <div style="margin-top: 20px; font-size: 13px;">
            <a href="login.html" style="color: #666; text-decoration: none; font-weight: 600;">🔒 Masuk Dasbor Guru</a>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then((registration) => {
                console.log('ServiceWorker sukses didaftarkan dengan scope: ', registration.scope);
            }).catch((err) => {
                console.error('ServiceWorker pendaftaran gagal: ', err);
            });
        });
    }
</script>
</body>
</html>
