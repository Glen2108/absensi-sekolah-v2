<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Siswa</title>
    
    <!-- Memanggil file CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Library SweetAlert2 untuk Notifikasi Modern -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Library HTML5-QRCode untuk Pemindai Kamera -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div class="container">
        <!-- Logo Sekolah -->
        <img src="logo-sekolah.png" alt="Logo Sekolah" class="logo-sekolah">
        
        <h2>Absensi Siswa</h2>
        
        <!-- Area Pemindai Kamera -->
        <div id="reader" style="width: 100%; max-width: 400px; margin: 0 auto 20px auto;"></div>
        
        <form id="absen-form">
            <!-- Input dibuat readonly agar siswa tidak mengetik manual, melainkan dari hasil scan -->
            <input type="text" id="namaSiswa" placeholder="Nama Siswa (Otomatis dari QR)" readonly required>
            <input type="text" id="kelasSiswa" placeholder="Kelas (Otomatis dari QR)" readonly required>

            <!-- Tambahan Pilihan Status -->
            <select id="statusSiswa" required style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc;">
                <option value="Hadir">Hadir (Di Sekolah)</option>
                <option value="Sakit">Sakit</option>
                <option value="Izin">Izin</option>
            </select>
            <!-- Tambahan: Kolom Keterangan (Sembunyi by default) -->
            <input type="text" id="keteranganSiswa" placeholder="Tulis alasan/keterangan..." style="display: none; width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box;">
            <button type="submit" id="btn-submit" disabled>Kirim Absen</button>
        </form>
    </div>

    <!-- Memanggil logika JavaScript utama -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
